# Blueprint de Render: un solo Web Service con mongoAPI, auditAPI y el gateway en el mismo contenedor
# (node scripts/start.js, igual que npm start). Las bases de datos son externas (planes gratuitos); ver el README,
# sección "Deploy on Render with free hosted databases". Los valores con `sync: false` se piden en el
# panel de Render al crear el Blueprint: no se escriben aquí.
services:
  - type: web
    name: pickaroo-api
    runtime: node
    plan: free
    region: oregon # elegir la región más cercana a las bases de datos
    buildCommand: npm install
    startCommand: node scripts/start.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET # un solo valor para los tres procesos
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      # Auditoría desactivada por defecto (no hace falta ScyllaDB). Para activarla: AUDIT_ENABLED=true y,
      # en el panel de Render, RABBITMQ_URL, SCYLLADB_CONTACT_POINTS, SCYLLADB_USERNAME, SCYLLADB_PASSWORD,
      # SCYLLADB_DATACENTER, SCYLLADB_SSL=true y SCYLLADB_CREATE_KEYSPACE=false (ver README).
      - key: AUDIT_ENABLED
        value: "false"
      # Datos de demostración (SEED=true): añadir SEED=true a mano solo en el primer despliegue y luego ponerlo en false.
      # Con NODE_ENV=production el seed exige TODAS estas contraseñas (si falta alguna, se omite y se registra el error).
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_CUSTOMER_PASSWORD
        sync: false
      - key: SEED_MANAGER_PASSWORD
        sync: false
      - key: SEED_STAFF_PASSWORD
        sync: false
      - key: SEED_DELIVERY_PASSWORD
        sync: false
      - key: SEED_DELIVERY2_PASSWORD
        sync: false
      - key: SEED_HUERTA_MANAGER_PASSWORD
        sync: false
      - key: SEED_HUERTA_STAFF_PASSWORD
        sync: false
      # Opcional: CORS_ORIGIN con los orígenes del dashboard separados por comas (vacío = abierto).
