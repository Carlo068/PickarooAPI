services:

  mongodb:
    image: mongo:8.0
    container_name: pickaroo-mongodb
    ports:
      - "27017:27017" # Puerto estándar de conexión de MongoDB
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: CR7lover
    volumes:
      - mongodb_data:/data/db
    networks:
      - pickaroo-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pickaroo-rabbitmq
    ports:
      - "5672:5672"   # Protocolo estándar AMQP para el driver amqplib desde Node.js
      - "15672:15672" # Interfaz web de administración de colas (Management Console)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - pickaroo-network

  redis:
    image: redis/redis-stack:latest # incluye RedisJSON + RediSearch (los usa Redis OM) y RedisInsight
    container_name: pickaroo-redis
    ports:
      - "6379:6379" # Redis
      - "8001:8001" # RedisInsight: interfaz web para ver el caché y las sesiones
    environment:
      REDIS_ARGS: "--requirepass pickaroo123 --appendonly yes" # appendonly: las sesiones sobreviven a un reinicio
    volumes:
      - redis_data:/data
    networks:
      - pickaroo-network

  neo4j:
    image: neo4j:5.26 # grafo de roles, permisos, sucursales y menús (RBAC)
    container_name: pickaroo-neo4j
    ports:
      - "7474:7474" # Neo4j Browser: http://localhost:7474
      - "7687:7687" # Bolt (neo4j-driver)
    environment:
      NEO4J_AUTH: neo4j/pickaroo123
    volumes:
      - neo4j_data:/data
    networks:
      - pickaroo-network

  scylladb:
    image: scylladb/scylla:5.4 # bitácora de auditoría (escritura masiva, inmutable)
    container_name: pickaroo-scylladb
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1
    ports:
      - "9042:9042" # CQL (cassandra-driver)
    volumes:
      - scylla_data:/var/lib/scylla
    networks:
      - pickaroo-network

networks:
  pickaroo-network:
    driver: bridge

# Volúmenes declarados para garantizar la persistencia de datos localmente tras reinicios
volumes:
  mongodb_data:
  rabbitmq_data:
  redis_data:
  neo4j_data:
  scylla_data:
