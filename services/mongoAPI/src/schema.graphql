extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key"])

scalar DateTime

enum Unit { UNIDAD KG LITRO }
enum UserRole { CUSTOMER ADMIN }
enum OrderMode { PICKUP DELIVERY }
enum OrderStatus { PENDING CONFIRMED PREPARING READY IN_DELIVERY DELIVERED CANCELLED }
"Qué referencia una partida de orden, lista o reporte."
enum ItemType { PRODUCT PACKAGE }

# ------------------------------------------------------------
# Ubicaciones
# ------------------------------------------------------------
"Dirección sin identidad propia: la de una sucursal o la copia de entrega de una orden."
type Location {
  street: String!
  city: String!
  state: String
  zipCode: String
  lat: Float
  lng: Float
}

"Dirección guardada por un usuario."
type Address {
  id: ID!
  label: String!
  street: String!
  city: String!
  state: String
  zipCode: String
  lat: Float
  lng: Float
  isDefault: Boolean!
}

# ------------------------------------------------------------
# Usuarios
# ------------------------------------------------------------
type User @key(fields: "id") {
  id: ID!
  name: String!
  email: String!
  avatarUrl: String
  role: UserRole!
  isActive: Boolean!
  addresses: [Address!]!
  defaultAddress: Address
  createdAt: DateTime!
}

# ------------------------------------------------------------
# Catálogo: categorías, productos y paquetes
# ------------------------------------------------------------
type Category @key(fields: "id") {
  id: ID!
  name: String!
  icon: String
  sortOrder: Int!
  products: [Product!]!
}

"Promoción de un producto. Vigente dentro de [startsAt, endsAt]; no se acumulan: aplica la de mayor porcentaje."
type ProductDiscount {
  id: ID!
  percent: Float!
  label: String
  startsAt: DateTime
  endsAt: DateTime
  isCurrent: Boolean!
}

type Product @key(fields: "id") {
  id: ID!
  name: String!
  description: String
  price: Float!
  imageUrl: String
  unit: Unit!
  stock: Int!
  isActive: Boolean!
  category: Category!
  discounts: [ProductDiscount!]!
  "Porcentaje de descuento vigente ahora (0 si no hay)."
  activeDiscountPercent: Float!
  "Precio unitario con el descuento vigente aplicado."
  effectivePrice: Float!
  "Paquetes activos que incluyen este producto."
  packages: [Package!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PackageItem {
  productId: ID!
  product: Product!
  quantity: Int!
}

"Combo de productos (p. ej. paquete para carne asada). Precio fijo; su stock se deriva del de sus productos."
type Package @key(fields: "id") {
  id: ID!
  name: String!
  description: String
  price: Float!
  imageUrl: String
  isActive: Boolean!
  items: [PackageItem!]!
  "Paquetes completos que se pueden armar con el stock actual (0 si algún producto está desactivado)."
  availableStock: Int!
  "Lo que costaría su contenido comprado por separado, con descuentos vigentes."
  alaCarteTotal: Float!
  "alaCarteTotal − price. Negativo si el paquete sale más caro que comprar suelto."
  savings: Float!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ------------------------------------------------------------
# Sucursales
# ------------------------------------------------------------
type Store @key(fields: "id") {
  id: ID!
  name: String!
  address: Location!
  phone: String
  schedule: String
  isActive: Boolean!
  "Tarifa base de reparto de esta sucursal (MXN)."
  deliveryFee: Float!
  "Subtotal a partir del cual el reparto es gratis (null = nunca gratis)."
  freeDeliveryThreshold: Float
}

# ------------------------------------------------------------
# Órdenes
# ------------------------------------------------------------
"Partida de una orden o cotización. Copia lo cobrado al momento de comprar."
type OrderItem {
  type: ItemType!
  product: Product
  package: Package
  name: String!
  unit: Unit
  quantity: Int!
  unitPrice: Float!
  discountPercent: Float!
  "Derivado: unitPrice × quantity − lineTotal."
  lineDiscount: Float!
  lineTotal: Float!
  "Contenido del paquete al momento de la compra (vacío en productos)."
  contents: [PackageItem!]!
}

type Order @key(fields: "id") {
  id: ID!
  number: String!
  user: User!
  mode: OrderMode!
  store: Store!
  deliveryAddress: Location
  status: OrderStatus!
  items: [OrderItem!]!
  "Derivado de las partidas."
  subtotal: Float!
  "Derivado de las partidas."
  discountTotal: Float!
  deliveryFee: Float!
  total: Float!
  notes: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

"Previsualización de precios de un carrito antes de confirmar la orden."
type OrderQuote {
  mode: OrderMode!
  items: [OrderItem!]!
  subtotal: Float!
  discountTotal: Float!
  deliveryFee: Float!
  total: Float!
}

# ------------------------------------------------------------
# Listas guardadas (pedidos frecuentes para volver a comprar)
# ------------------------------------------------------------
type ShoppingListItem {
  type: ItemType!
  product: Product
  package: Package
  quantity: Int!
}

type ShoppingList {
  id: ID!
  name: String!
  user: User!
  items: [ShoppingListItem!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ------------------------------------------------------------
# Reportes
# ------------------------------------------------------------
type SalesRow {
  type: ItemType!
  itemId: ID!
  name: String!
  quantity: Int!
  revenue: Float!
  orderCount: Int!
}

"Cuánto producto se necesita para surtir los paquetes vendidos en un periodo (para las compras del restaurante)."
type ComponentDemandRow {
  productId: ID!
  name: String!
  "Unidades del producto requeridas por los paquetes vendidos."
  quantityNeeded: Int!
  "Paquetes vendidos que lo contienen."
  packagesSold: Int!
  "En cuántos paquetes distintos aparece."
  inPackages: Int!
}

# ============================================================
# Inputs
# ============================================================
input LocationInput {
  street: String!
  city: String!
  state: String
  zipCode: String
  lat: Float
  lng: Float
}

input AddressInput {
  label: String!
  street: String!
  city: String!
  state: String
  zipCode: String
  lat: Float
  lng: Float
  "Marcarla como predeterminada (la primera dirección siempre lo es)."
  isDefault: Boolean = false
}

input CreateUserInput {
  name: String!
  email: String!
  password: String
  avatarUrl: String
  role: UserRole = CUSTOMER
}

input CategoryInput {
  name: String!
  icon: String
  sortOrder: Int = 0
}

input ProductInput {
  categoryId: ID!
  name: String!
  description: String
  price: Float!
  imageUrl: String
  unit: Unit = UNIDAD
  stock: Int = 0
  isActive: Boolean = true
}

input ProductUpdateInput {
  categoryId: ID
  name: String
  description: String
  price: Float
  imageUrl: String
  unit: Unit
  isActive: Boolean
}

input PackageItemInput {
  productId: ID!
  quantity: Int!
}

"Alta de un paquete. Debe incluir al menos 2 productos distintos."
input PackageInput {
  name: String!
  description: String
  price: Float!
  imageUrl: String
  isActive: Boolean = true
  items: [PackageItemInput!]!
}

input PackageUpdateInput {
  name: String
  description: String
  price: Float
  imageUrl: String
  isActive: Boolean
  items: [PackageItemInput!]
}

input DiscountInput {
  percent: Float!
  label: String
  startsAt: DateTime
  endsAt: DateTime
}

input StoreInput {
  name: String!
  address: LocationInput!
  phone: String
  schedule: String
  deliveryFee: Float = 0
  freeDeliveryThreshold: Float
}

input StoreUpdateInput {
  name: String
  address: LocationInput
  phone: String
  schedule: String
  isActive: Boolean
  deliveryFee: Float
  freeDeliveryThreshold: Float
}

"Partida de carrito: indicar productId O packageId."
input CartItemInput {
  productId: ID
  packageId: ID
  quantity: Int!
}

input QuoteInput {
  mode: OrderMode!
  storeId: ID
  items: [CartItemInput!]!
}

input CreateOrderInput {
  userId: ID!
  mode: OrderMode!
  storeId: ID
  "Dirección para DELIVERY. Si se omite se usa addressId o la predeterminada del usuario."
  address: LocationInput
  addressId: ID
  items: [CartItemInput!]!
  notes: String
  "Evita órdenes duplicadas por doble envío del cliente."
  idempotencyKey: String
}

input ShoppingListInput {
  userId: ID!
  name: String!
}

# ============================================================
# Query / Mutation
# ============================================================
type Query {
  categories: [Category!]!
  category(id: ID!): Category

  products(categoryId: ID, search: String, activeOnly: Boolean = true, limit: Int = 20, offset: Int = 0): [Product!]!
  product(id: ID!): Product

  packages(activeOnly: Boolean = true): [Package!]!
  package(id: ID!): Package

  stores(activeOnly: Boolean = true): [Store!]!
  store(id: ID!): Store

  users(limit: Int = 20, offset: Int = 0): [User!]!
  user(id: ID!): User

  orders(userId: ID, status: OrderStatus, limit: Int = 20, offset: Int = 0): [Order!]!
  order(id: ID!): Order
  orderByNumber(number: String!): Order

  shoppingLists(userId: ID!): [ShoppingList!]!
  shoppingList(id: ID!): ShoppingList

  "Cotiza un carrito (precios, descuentos y costo de envío) sin crear la orden."
  quoteOrder(input: QuoteInput!): OrderQuote!

  "Pipeline de agregación: ventas por producto y paquete en un periodo ($match → $unwind → $group → $sort)."
  salesReport(from: DateTime!, to: DateTime!): [SalesRow!]!

  "Pipeline de agregación anidada: explota los paquetes vendidos en sus productos para planear compras."
  packageComponentDemand(from: DateTime!, to: DateTime!): [ComponentDemandRow!]!
}

type Mutation {
  createUser(input: CreateUserInput!): User!
  addUserAddress(userId: ID!, address: AddressInput!): User!
  setDefaultAddress(userId: ID!, addressId: ID!): User!
  removeUserAddress(userId: ID!, addressId: ID!): User!

  createCategory(input: CategoryInput!): Category!

  createProduct(input: ProductInput!): Product!
  updateProduct(id: ID!, input: ProductUpdateInput!): Product!
  setProductActive(id: ID!, active: Boolean!): Product!
  setProductStock(id: ID!, stock: Int!): Product!
  addProductDiscount(productId: ID!, input: DiscountInput!): Product!
  removeProductDiscount(productId: ID!, discountId: ID!): Product!

  createPackage(input: PackageInput!): Package!
  updatePackage(id: ID!, input: PackageUpdateInput!): Package!
  setPackageActive(id: ID!, active: Boolean!): Package!

  createStore(input: StoreInput!): Store!
  updateStore(id: ID!, input: StoreUpdateInput!): Store!

  createOrder(input: CreateOrderInput!): Order!
  updateOrderStatus(id: ID!, status: OrderStatus!): Order!
  cancelOrder(id: ID!): Order!

  createShoppingList(input: ShoppingListInput!): ShoppingList!
  "Agrega (o suma cantidad a) un producto O un paquete."
  addItemToShoppingList(listId: ID!, productId: ID, packageId: ID, quantity: Int = 1): ShoppingList!
  removeItemFromShoppingList(listId: ID!, productId: ID, packageId: ID): ShoppingList!
  deleteShoppingList(id: ID!): Boolean!
}
