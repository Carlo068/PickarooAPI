# GENERADO AUTOMÁTICAMENTE. NO EDITAR A MANO.
# Esquema GraphQL que ven los clientes a través del gateway (sin directivas de federación).
# Se genera a partir de los subgrafos con: npm run schema:build
# Verificación (CI/local): npm run schema:check
# Regenerar y commitear este archivo en el mismo commit que cambie un schema.graphql de un subgrafo.

"""
Lo que un usuario puede hacer. Se calcula en el login y viaja en su sesión.
"""
type Access {
  userId: ID!
  role: UserRole!

  """
  Permisos efectivos: los del rol más los de todos los roles que hereda (p. ej. orders:prepare).
  """
  permissions: [String!]!

  """
  Sucursales asignadas (relación WORKS_AT). El personal solo opera órdenes de estas sucursales.
  """
  stores: [Store!]!

  """
  True si Neo4j no respondía al iniciar sesión: la sesión no tiene permisos.
  """
  degraded: Boolean!
}

"""Dirección guardada por un usuario."""
type Address {
  id: ID!
  label: String!
  street: String!
  city: String!
  state: String
  zipCode: String
  lat: Float
  lng: Float
  isDefault: Boolean!
}

input AddressInput {
  label: String!
  street: String!
  city: String!
  state: String
  zipCode: String
  lat: Float
  lng: Float

  """Marcarla como predeterminada (la primera dirección siempre lo es)."""
  isDefault: Boolean = false
}

"""Categoría del evento de auditoría (partición de events_by_day)."""
enum AuditCategory {
  SECURITY
  ADMIN
  CATALOG
  ORDER
}

type AuditCount {
  category: AuditCategory!
  type: String!
  total: Int!
  failures: Int!
}

"""Evento inmutable de la bitácora (ScyllaDB)."""
type AuditEvent {
  id: ID!

  """LOGIN_SUCCESS, ACCESS_DENIED, PRODUCT_UPDATED, ORDER_STATUS_CHANGED…"""
  type: String!
  category: AuditCategory!

  """Id del usuario que actuó, o ANONYMOUS."""
  actorId: String!

  """
  Usuario completo (resuelto por el subgrafo pickaroo). Null si fue anónimo.
  """
  actor: User
  actorRole: String

  """
  Tipo del objeto afectado: User, Product, Package, Order, Store, Category.
  """
  targetType: String
  targetId: String
  success: Boolean!
  reason: String
  ip: String
  userAgent: String

  """Detalle del evento en JSON (p. ej. cambios de precio { from, to })."""
  metadata: String!

  """Fecha ISO-8601 (UTC)."""
  occurredAt: String!
}

"""
Resultado de iniciar sesión. Enviar el token en el header `Authorization: Bearer <token>`.
"""
type AuthPayload {
  token: String!

  """Segundos de vida del token (y de su sesión en Redis)."""
  expiresIn: Int!

  """
  Token opaco de un solo uso para pedir otra sesión con la mutación `refreshToken`, sin la contraseña. Guardarlo cifrado; cada canje devuelve uno nuevo.
  """
  refreshToken: String!

  """Segundos de vida del refresh token (cada canje los renueva)."""
  refreshExpiresIn: Int!
  user: User!

  """
  Rol, permisos efectivos y sucursales leídos de Neo4j al iniciar sesión.
  """
  access: Access!

  """Menú de navegación según el rol (Neo4j)."""
  menu: [MenuItem!]!
}

"""
El precio no se guarda en el carrito: se calcula al leerlo contra el catálogo actual. Un carrito es de una sola sucursal.
"""
type Cart {
  """
  Sucursal del carrito, la de sus partidas (null si está vacío). Agregar un artículo de otra falla con CART_STORE_MISMATCH.
  """
  store: Store
  items: [CartLine!]!
  unavailable: [UnavailableCartLine!]!
  itemCount: Int!

  """
  Cotización de las partidas disponibles (null si no hay ninguna). Su quoteId se manda a checkoutCart.
  """
  quote: OrderQuote

  """
  Motivo por el que no se pudo cotizar (p. ej. stock insuficiente al sumar producto suelto y paquete).
  """
  quoteError: String
}

"""Partida de carrito: indicar productId O packageId."""
input CartItemInput {
  productId: ID
  packageId: ID
  quantity: Int!
}

type CartLine {
  type: ItemType!
  product: Product
  package: Package
  quantity: Int!

  """False si la partida aparece en `unavailable`."""
  available: Boolean!
}

"""Categoría global, compartida por todas las sucursales."""
type Category {
  id: ID!
  name: String!
  icon: String
  sortOrder: Int!

  """Productos activos de la categoría en todas las sucursales activas."""
  products: [Product!]!
}

input CategoryInput {
  name: String!
  icon: String
  sortOrder: Int = 0
}

"""
Compra el carrito del usuario autenticado (las partidas salen de Redis).
"""
input CheckoutCartInput {
  mode: OrderMode!

  """
  Pista opcional: la sucursal es la del carrito. Si difiere, STORE_MISMATCH.
  """
  storeId: ID
  address: LocationInput
  addressId: ID
  notes: String
  idempotencyKey: String
  quoteId: ID
}

"""
Cuánto producto se necesita para surtir los paquetes vendidos en un periodo (para las compras del restaurante).
"""
type ComponentDemandRow {
  storeId: ID!
  storeName: String!
  productId: ID!
  name: String!

  """Unidades del producto requeridas por los paquetes vendidos."""
  quantityNeeded: Int!

  """Paquetes vendidos que lo contienen."""
  packagesSold: Int!

  """En cuántos paquetes distintos aparece."""
  inPackages: Int!
}

input CreateOrderInput {
  userId: ID!
  mode: OrderMode!

  """
  Pista opcional: la sucursal es la de los artículos. Si difiere, STORE_MISMATCH.
  """
  storeId: ID

  """
  Dirección para DELIVERY. Si se omite se usa addressId o la predeterminada del usuario.
  """
  address: LocationInput
  addressId: ID
  items: [CartItemInput!]!
  notes: String

  """Evita órdenes duplicadas por doble envío del cliente."""
  idempotencyKey: String

  """
  Cotización que el cliente aceptó. Si los precios cambiaron, la compra se rechaza con PRICE_CHANGED y extensions.newQuote.
  """
  quoteId: ID
}

input CreateUserInput {
  name: String!
  email: String!

  """Mínimo 8 caracteres."""
  password: String!
  avatarUrl: String

  """
  En el registro abierto siempre es CUSTOMER; otro rol requiere el permiso users:manage.
  """
  role: UserRole = CUSTOMER
}

scalar DateTime

input DiscountInput {
  percent: Float!
  label: String
  startsAt: DateTime
  endsAt: DateTime
}

"""
Última posición conocida del repartidor de una orden en camino: solo coordenadas y tiempos, nunca quién es ni su recorrido.
"""
type DriverLocation {
  lat: Float!
  lng: Float!

  """Cuándo la recibió el servidor."""
  updatedAt: DateTime!

  """
  Segundos que han pasado desde updatedAt (0 o más): la app puede marcar la posición como vieja.
  """
  ageSeconds: Int!
}

"""Qué referencia una partida de orden, lista o reporte."""
enum ItemType {
  PRODUCT
  PACKAGE
}

"""
Dirección sin identidad propia: la de una sucursal o la copia de entrega de una orden.
"""
type Location {
  street: String!
  city: String!
  state: String
  zipCode: String
  lat: Float
  lng: Float
}

input LocationInput {
  street: String!
  city: String!
  state: String
  zipCode: String
  lat: Float
  lng: Float
}

input LoginInput {
  email: String!
  password: String!
}

"""Elemento del menú de navegación (con submenús)."""
type MenuItem {
  id: ID!
  title: String!
  order: Int!

  """Ruta del cliente web; null en los contenedores de submenús."""
  path: String
  children: [MenuItem!]!
}

type Mutation {
  login(input: LoginInput!): AuthPayload!

  """
  Canjea un refresh token por una sesión nueva (permisos releídos de Neo4j) y otro refresh token. Público: no lleva Authorization. Un reintento con el mismo token dentro de la ventana de gracia devuelve el mismo resultado. Errores: INVALID_REFRESH_TOKEN, REFRESH_TOKEN_REUSED (borrar el token e ir al login), SERVICE_UNAVAILABLE (conservar el token y reintentar).
  """
  refreshToken(token: String!): AuthPayload!

  """
  Revoca la sesión del token actual: deja de servir aunque no haya expirado. Con `refreshToken` (del mismo usuario) revoca también ese dispositivo: su refresh token y todas sus sesiones.
  """
  logout(refreshToken: String): Boolean!

  """
  Cierra la sesión en todos los dispositivos: revoca todas las sesiones y todos los refresh tokens del usuario.
  """
  logoutAllDevices: Boolean!

  """
  Cambia el rol en Neo4j (y su espejo en Mongo) y revoca las sesiones y los refresh tokens del usuario (users:manage).
  """
  assignRole(userId: ID!, role: UserRole!): Access!

  """
  Asigna una sucursal al personal (WORKS_AT) y revoca sus sesiones y refresh tokens (users:manage).
  """
  assignUserToStore(userId: ID!, storeId: ID!): Access!
  removeUserFromStore(userId: ID!, storeId: ID!): Access!
  createUser(input: CreateUserInput!): User!
  addUserAddress(userId: ID!, address: AddressInput!): User!
  setDefaultAddress(userId: ID!, addressId: ID!): User!
  removeUserAddress(userId: ID!, addressId: ID!): User!
  createCategory(input: CategoryInput!): Category!
  createProduct(input: ProductInput!): Product!
  updateProduct(id: ID!, input: ProductUpdateInput!): Product!
  setProductActive(id: ID!, active: Boolean!): Product!
  setProductStock(id: ID!, stock: Int!): Product!
  addProductDiscount(productId: ID!, input: DiscountInput!): Product!
  removeProductDiscount(productId: ID!, discountId: ID!): Product!
  createPackage(input: PackageInput!): Package!
  updatePackage(id: ID!, input: PackageUpdateInput!): Package!
  setPackageActive(id: ID!, active: Boolean!): Package!
  createStore(input: StoreInput!): Store!
  updateStore(id: ID!, input: StoreUpdateInput!): Store!
  createOrder(input: CreateOrderInput!): Order!

  """
  Agrega (o suma cantidad a) un producto O un paquete al carrito del usuario autenticado. Debe ser de la sucursal del carrito (CART_STORE_MISMATCH).
  """
  addToCart(productId: ID, packageId: ID, quantity: Int = 1): Cart!

  """Fija la cantidad exacta; 0 quita la partida."""
  setCartItemQuantity(productId: ID, packageId: ID, quantity: Int!): Cart!
  removeFromCart(productId: ID, packageId: ID): Cart!
  clearCart: Boolean!
  checkoutCart(input: CheckoutCartInput!): Order!

  """
  Pasos de reparto de una orden DELIVERY (READY → IN_DELIVERY → DELIVERED, sin saltarse IN_DELIVERY): su repartidor asignado o ADMIN; sin repartidor nadie la saca a reparto (FORBIDDEN NOT_ASSIGNED_DRIVER / NO_DRIVER_ASSIGNED).
  """
  updateOrderStatus(id: ID!, status: OrderStatus!): Order!
  cancelOrder(id: ID!): Order!

  """
  El repartidor toma una orden DELIVERY en READY sin repartidor de su sucursal (orders:deliver), que no sea suya (OWN_ORDER). Atómico: si otro la tomó, ORDER_NOT_AVAILABLE; si ya lleva otra, ALREADY_DELIVERING.
  """
  acceptDelivery(orderId: ID!): Order!

  """
  Devuelve a la lista de disponibles una orden aceptada que sigue en READY: su repartidor, el personal de mostrador de la sucursal (orders:prepare) o ADMIN.
  """
  releaseDelivery(orderId: ID!): Order!

  """
  El repartidor asignado reporta su posición mientras lleva la orden (orders:deliver; DELIVERY en IN_DELIVERY). Devuelve true también cuando el punto se ignora por llegar a menos de 1 s del anterior de esa orden. La hora del punto es la de recepción en el servidor: tras una reconexión no se encolan ni se reenvían puntos viejos, se manda la posición actual. Errores: FORBIDDEN (NOT_ASSIGNED_DRIVER, NO_DRIVER_ASSIGNED, STORE_NOT_ASSIGNED, PERMISSION_REQUIRED), NOT_FOUND, INVALID_ORDER_STATE (status, mode), INVALID_LOCATION (field) y SERVICE_UNAVAILABLE (service LOCATION), este último solo si Redis falla a mitad de la operación. Con Redis caído por completo la sesión no se puede verificar y llega UNAUTHENTICATED (que tampoco se registra en la bitácora para esta operación): no cerrar la sesión, renovarla con el refresh token y reintentar con espera creciente. La app deja de reportar solo ante FORBIDDEN, NOT_FOUND o INVALID_ORDER_STATE.
  """
  reportDriverLocation(orderId: ID!, lat: Float!, lng: Float!): Boolean!
  createShoppingList(input: ShoppingListInput!): ShoppingList!

  """Agrega (o suma cantidad a) un producto O un paquete."""
  addItemToShoppingList(listId: ID!, productId: ID, packageId: ID, quantity: Int = 1): ShoppingList!
  removeItemFromShoppingList(listId: ID!, productId: ID, packageId: ID): ShoppingList!
  deleteShoppingList(id: ID!): Boolean!
}

type Order {
  id: ID!
  number: String!
  user: User!
  mode: OrderMode!
  store: Store!
  deliveryAddress: Location
  status: OrderStatus!

  """
  Repartidor que aceptó la orden (acceptDelivery). Null si nadie la ha aceptado o se liberó; se conserva al entregarla o cancelarla.
  """
  driver: OrderDriver

  """Cuándo la aceptó su repartidor actual."""
  assignedAt: DateTime

  """
  Última posición del repartidor (mismas reglas que la consulta driverLocation): null si la orden no está IN_DELIVERY o no hay punto vigente. Si Redis falla a mitad de la consulta, SERVICE_UNAVAILABLE (service LOCATION).
  """
  driverLocation: DriverLocation

  """
  Cambios de estado, del más antiguo al más reciente. Lo lee quien puede ver la orden.
  """
  statusHistory: [OrderStatusChange!]!
  items: [OrderItem!]!

  """Derivado de las partidas."""
  subtotal: Float!

  """Derivado de las partidas."""
  discountTotal: Float!
  deliveryFee: Float!
  total: Float!
  notes: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
Quién hizo un cambio de estado: solo id y nombre (ni correo ni direcciones).
"""
type OrderActor {
  id: ID!
  name: String!
}

"""
Repartidor de una orden: solo id y nombre (el cliente no ve su correo ni su rol).
"""
type OrderDriver {
  id: ID!
  name: String!
}

"""
Partida de una orden o cotización. Copia lo cobrado al momento de comprar.
"""
type OrderItem {
  type: ItemType!
  product: Product
  package: Package
  name: String!
  unit: Unit
  quantity: Int!
  unitPrice: Float!
  discountPercent: Float!

  """Derivado: unitPrice × quantity − lineTotal."""
  lineDiscount: Float!
  lineTotal: Float!

  """Contenido del paquete al momento de la compra (vacío en productos)."""
  contents: [PackageItem!]!
}

enum OrderMode {
  PICKUP
  DELIVERY
}

"""Previsualización de precios de un carrito antes de confirmar la orden."""
type OrderQuote {
  mode: OrderMode!
  items: [OrderItem!]!
  subtotal: Float!
  discountTotal: Float!
  deliveryFee: Float!
  total: Float!

  """
  Se manda en createOrder/checkoutCart para confirmar este total. Null si Redis no está disponible.
  """
  quoteId: ID

  """La cotización vale 15 minutos."""
  expiresAt: DateTime
}

enum OrderStatus {
  PENDING
  CONFIRMED
  PREPARING
  READY
  IN_DELIVERY
  DELIVERED
  CANCELLED
}

"""Un cambio de estado de la orden."""
type OrderStatusChange {
  """Estado al que pasó la orden."""
  status: OrderStatus!
  at: DateTime!

  """Rol de quien lo hizo. Null en entradas inferidas."""
  byRole: UserRole

  """
  Quien lo hizo (id y nombre). Solo lo ven quienes no son el cliente de la orden (personal de la sucursal, su repartidor, ADMIN); para el cliente es null.
  """
  by: OrderActor

  """
  true: la entrada se reconstruyó de las fechas de la orden (anterior al historial); no tiene autor.
  """
  inferred: Boolean!
}

"""
Combo de productos de una misma sucursal (p. ej. paquete para carne asada). Precio fijo; su stock se deriva del de sus productos.
"""
type Package {
  id: ID!

  """
  Sucursal del paquete; todos sus productos son de ella. No cambia después del alta.
  """
  store: Store!
  name: String!
  description: String
  price: Float!
  imageUrl: String
  isActive: Boolean!
  items: [PackageItem!]!

  """
  Paquetes completos que se pueden armar con el stock actual (0 si algún producto está desactivado).
  """
  availableStock: Int!

  """
  Lo que costaría su contenido comprado por separado, con descuentos vigentes.
  """
  alaCarteTotal: Float!

  """
  alaCarteTotal − price. Negativo si el paquete sale más caro que comprar suelto.
  """
  savings: Float!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
Alta de un paquete. Debe incluir al menos 2 productos distintos, todos de su sucursal.
"""
input PackageInput {
  """Sucursal del paquete; debe estar en el alcance de quien lo da de alta."""
  storeId: ID!
  name: String!
  description: String
  price: Float!
  imageUrl: String
  isActive: Boolean = true
  items: [PackageItemInput!]!
}

type PackageItem {
  productId: ID!
  product: Product!
  quantity: Int!
}

input PackageItemInput {
  productId: ID!
  quantity: Int!
}

input PackageUpdateInput {
  name: String
  description: String
  price: Float
  imageUrl: String
  isActive: Boolean
  items: [PackageItemInput!]
}

type Product {
  id: ID!

  """Sucursal dueña del producto y de su stock. No cambia después del alta."""
  store: Store!
  name: String!
  description: String
  price: Float!
  imageUrl: String
  unit: Unit!

  """Stock de la sucursal del producto."""
  stock: Int!
  isActive: Boolean!
  category: Category!
  discounts: [ProductDiscount!]!

  """Porcentaje de descuento vigente ahora (0 si no hay)."""
  activeDiscountPercent: Float!

  """Precio unitario con el descuento vigente aplicado."""
  effectivePrice: Float!

  """Paquetes activos que incluyen este producto."""
  packages: [Package!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
Promoción de un producto. Vigente dentro de [startsAt, endsAt]; no se acumulan: aplica la de mayor porcentaje.
"""
type ProductDiscount {
  id: ID!
  percent: Float!
  label: String
  startsAt: DateTime
  endsAt: DateTime
  isCurrent: Boolean!
}

input ProductInput {
  """
  Sucursal dueña del producto; debe estar en el alcance de quien lo da de alta.
  """
  storeId: ID!
  categoryId: ID!
  name: String!
  description: String
  price: Float!
  imageUrl: String
  unit: Unit = UNIDAD
  stock: Int = 0
  isActive: Boolean = true
}

input ProductUpdateInput {
  categoryId: ID
  name: String
  description: String
  price: Float
  imageUrl: String
  unit: Unit
  isActive: Boolean
}

type Query {
  """
  Eventos de una categoría en un día (YYYY-MM-DD, UTC; hoy por omisión), más recientes primero.
  """
  auditEvents(category: AuditCategory!, day: String, type: String, limit: Int = 50): [AuditEvent!]!

  """Lo que hizo un usuario, más reciente primero."""
  auditByActor(actorId: ID!, limit: Int = 50): [AuditEvent!]!

  """
  Historia de un objeto: una orden, el precio de un producto, un usuario…
  """
  auditByTarget(targetType: String!, targetId: ID!, limit: Int = 50): [AuditEvent!]!

  """Conteo por tipo de evento en un día (todas las categorías)."""
  auditSummary(day: String): [AuditCount!]!

  """Usuario autenticado (requiere token)."""
  me: User

  """Rol, permisos y sucursales de la sesión actual."""
  myAccess: Access!

  """Menú de navegación del usuario autenticado."""
  myMenu: [MenuItem!]!

  """
  Requiere sesión. True si el rol del usuario autenticado (o uno que hereda) tiene acceso a la ruta web `path` ([:CAN_ACCESS] en Neo4j; coincidencia exacta, p. ej. /sucursal/pedidos). Una ruta sin registrar da false. Se consulta el grafo en cada llamada: sin Neo4j, SERVICE_UNAVAILABLE (service RBAC).
  """
  canAccessRoute(path: String!): Boolean!

  """Catálogo de roles con su herencia y permisos (users:manage)."""
  roles: [RoleInfo!]!

  """Acceso de cualquier usuario según Neo4j (users:manage)."""
  userAccess(userId: ID!): Access
  categories: [Category!]!
  category(id: ID!): Category

  """
  Sin storeId: el marketplace completo (productos de todas las sucursales activas).
  """
  products(storeId: ID, categoryId: ID, search: String, activeOnly: Boolean = true, limit: Int = 20, offset: Int = 0): [Product!]!
  product(id: ID!): Product

  """Sin storeId: los paquetes de todas las sucursales activas."""
  packages(storeId: ID, activeOnly: Boolean = true): [Package!]!
  package(id: ID!): Package
  stores(activeOnly: Boolean = true): [Store!]!
  store(id: ID!): Store
  users(limit: Int = 20, offset: Int = 0): [User!]!
  user(id: ID!): User

  """
  Cliente: las suyas. Personal: las de sus sucursales (repartidor: las disponibles para aceptar más las asignadas a él). ADMIN: todas.
  """
  orders(userId: ID, storeId: ID, status: OrderStatus, limit: Int = 20, offset: Int = 0): [Order!]!
  order(id: ID!): Order
  orderByNumber(number: String!): Order

  """
  Órdenes DELIVERY en READY sin repartidor de las sucursales del alcance (orders:deliver; ADMIN: todas), la más antigua primero.
  """
  availableDeliveries(storeId: ID, limit: Int = 20, offset: Int = 0): [Order!]!

  """
  Entregas del repartidor autenticado (orders:deliver). active: true, la activa (READY o IN_DELIVERY asignada a él); false, las entregadas y canceladas, la más reciente primero.
  """
  myDeliveries(active: Boolean = false, limit: Int = 20, offset: Int = 0): [Order!]!

  """La entrega activa del repartidor autenticado, o null (orders:deliver)."""
  currentDelivery: Order

  """
  Última posición del repartidor de una orden en camino, para quien puede ver la orden (su cliente, el personal de la sucursal, su repartidor asignado, ADMIN; si no, FORBIDDEN ORDER_VIEW_DENIED). Null si la orden no existe, no es DELIVERY en IN_DELIVERY, o no hay punto vigente (aún no se reportó o venció su TTL). Solo coordenadas y tiempos. Si Redis falla a mitad de la consulta, SERVICE_UNAVAILABLE (service LOCATION); con Redis caído por completo la sesión no se puede verificar y llega UNAUTHENTICATED.
  """
  driverLocation(orderId: ID!): DriverLocation
  shoppingLists(userId: ID!): [ShoppingList!]!
  shoppingList(id: ID!): ShoppingList

  """
  Cotiza un carrito (precios, descuentos y costo de envío) sin crear la orden.
  """
  quoteOrder(input: QuoteInput!): OrderQuote!

  """
  Carrito del usuario autenticado, contrastado con el catálogo actual y cotizado. storeId es una pista: si difiere de la sucursal del carrito, STORE_MISMATCH.
  """
  cart(mode: OrderMode = PICKUP, storeId: ID): Cart!

  """
  Últimas 20 órdenes del usuario autenticado (ids en Redis, datos desde Mongo).
  """
  recentOrders: [Order!]!

  """
  Pipeline de agregación: ventas por sucursal, producto y paquete en un periodo ($match → $unwind → $group → $sort). Sin storeId: las sucursales del alcance (ADMIN: todas).
  """
  salesReport(from: DateTime!, to: DateTime!, storeId: ID): [SalesRow!]!

  """
  Pipeline de agregación anidada: explota los paquetes vendidos en sus productos para planear compras. Sin storeId: las sucursales del alcance (ADMIN: todas).
  """
  packageComponentDemand(from: DateTime!, to: DateTime!, storeId: ID): [ComponentDemandRow!]!
}

input QuoteInput {
  mode: OrderMode!

  """
  Pista opcional: la sucursal es la de los artículos. Si difiere, STORE_MISMATCH.
  """
  storeId: ID
  items: [CartItemInput!]!
}

"""Rol del catálogo RBAC."""
type RoleInfo {
  name: UserRole!
  description: String

  """Roles de los que hereda permisos."""
  inherits: [UserRole!]!

  """Permisos asignados directamente al rol."""
  permissions: [String!]!

  """Permisos propios más los heredados."""
  effectivePermissions: [String!]!
  userCount: Int!
}

type SalesRow {
  storeId: ID!
  storeName: String!
  type: ItemType!
  itemId: ID!
  name: String!
  quantity: Int!
  revenue: Float!
  orderCount: Int!
}

type ShoppingList {
  id: ID!
  name: String!
  user: User!
  items: [ShoppingListItem!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input ShoppingListInput {
  userId: ID!
  name: String!
}

type ShoppingListItem {
  type: ItemType!
  product: Product
  package: Package
  quantity: Int!
}

type Store {
  id: ID!
  name: String!
  address: Location!
  phone: String
  schedule: String
  isActive: Boolean!

  """Tarifa base de reparto de esta sucursal (MXN)."""
  deliveryFee: Float!

  """Subtotal a partir del cual el reparto es gratis (null = nunca gratis)."""
  freeDeliveryThreshold: Float

  """
  Catálogo de la sucursal. Si está desactivada, vacío salvo para quien administra su catálogo o inventario.
  """
  products(categoryId: ID, search: String, activeOnly: Boolean = true, limit: Int = 20, offset: Int = 0): [Product!]!
  packages(activeOnly: Boolean = true): [Package!]!

  """Categorías con al menos un producto activo en esta sucursal."""
  categories: [Category!]!
}

input StoreInput {
  name: String!
  address: LocationInput!
  phone: String
  schedule: String
  deliveryFee: Float = 0
  freeDeliveryThreshold: Float
}

input StoreUpdateInput {
  name: String
  address: LocationInput
  phone: String
  schedule: String
  isActive: Boolean
  deliveryFee: Float
  freeDeliveryThreshold: Float
}

type UnavailableCartLine {
  type: ItemType!
  productId: ID
  packageId: ID
  name: String!
  quantity: Int!
  reason: UnavailableReason!

  """Cuántas unidades se pueden comprar ahora."""
  availableQuantity: Int!
}

"""
Por qué una partida del carrito no se puede comprar ahora. OTHER_STORE: es de otra sucursal que la del carrito (carritos anteriores al marketplace).
"""
enum UnavailableReason {
  DELETED
  INACTIVE
  OUT_OF_STOCK
  INSUFFICIENT_STOCK
  OTHER_STORE
}

enum Unit {
  UNIDAD
  KG
  LITRO
}

"""
Usuario del subgrafo pickaroo: el gateway resuelve sus campos (nombre, correo…).
"""
type User {
  id: ID!
  name: String!
  email: String!
  avatarUrl: String
  role: UserRole!
  isActive: Boolean!
  addresses: [Address!]!
  defaultAddress: Address
  createdAt: DateTime!
}

"""
Roles del grafo RBAC (Neo4j). Jerarquía: ADMIN → MANAGER → STAFF → CUSTOMER; DELIVERY → CUSTOMER.
"""
enum UserRole {
  CUSTOMER
  STAFF
  DELIVERY
  MANAGER
  ADMIN
}
